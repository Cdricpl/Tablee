<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c2a1d" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Tablée — ce qu'on cuisine, ce qu'on partage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="masthead">
    <div class="masthead-top">
      <span id="issueNo">N° 001</span>
      <span class="dot">·</span>
      <span id="issueDay">DIMANCHE</span>
      <button type="button" id="bellBtn" class="masthead-bell" aria-label="Notifications"></button>
    </div>
    <p class="tagline"><em>ce qu'on cuisine, ce qu'on partage</em></p>
    <h1 class="logo">Tab<em>lée</em></h1>
    <div class="est"><span class="rule"></span><em>est. 2026</em><span class="rule"></span></div>
  </header>

  <main id="app"></main>

  <nav id="bottomNav" class="bottom-nav" aria-label="Navigation principale"></nav>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <div id="updateBanner" class="update-banner" hidden>
    Une nouvelle version de Tablée est disponible.
    <button type="button" id="updateBannerBtn">Recharger</button>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('sw.js');

          const showBanner = sw => {
            const b = document.getElementById('updateBanner');
            const btn = document.getElementById('updateBannerBtn');
            if (!b || !btn) return;
            b.hidden = false;
            btn.onclick = () => {
              sw.postMessage({ type: 'SKIP_WAITING' });
            };
          };

          if (reg.waiting && navigator.serviceWorker.controller) showBanner(reg.waiting);

          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                showBanner(nw);
              }
            });
          });

          let reloading = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloading) return;
            reloading = true;
            window.location.reload();
          });

          // Sans cela, le navigateur ne cherche une nouvelle version qu'à la
          // navigation, et pour une PWA installée qu'on ne ferme jamais cela
          // peut vouloir dire des jours. On redemande à chaque retour sur
          // l'app, au plus une fois par minute.
          let lastCheck = 0;
          const checkForUpdate = () => {
            const now = Date.now();
            if (now - lastCheck < 60000) return;
            lastCheck = now;
            reg.update().catch(() => {});
          };
          checkForUpdate();
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') checkForUpdate();
          });
          window.addEventListener('focus', checkForUpdate);
        } catch (_) {}
      });
    }
  </script>
</body>
</html>
